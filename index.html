<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novan · Video hướng dẫn mua hàng</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#02030a;--card:rgba(8,10,26,.72);--line:rgba(255,255,255,.09);--red:#3b7bff;--red2:#9b6bff;--gold:#5cd6ff;--dark:#5a2bd6;--text:#f1f4ff;--muted:#9aa3c4;--ease:cubic-bezier(.22,1,.36,1);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100%;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--text);background:var(--bg);padding:20px 14px 60px;display:flex;justify-content:center;overflow-x:hidden}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:380px;height:380px;background:#3b7bff;top:-120px;left:-120px}
.aurora i:nth-child(2){width:340px;height:340px;background:#6d28d9;top:35%;right:-140px;animation-duration:23s}
@keyframes drift{to{transform:translate(70px,60px) scale(1.2)}}
.wrap{position:relative;z-index:2;width:100%;max-width:520px;display:flex;flex-direction:column;gap:18px}
.card{position:relative;background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:0 26px 50px -22px #000,inset 0 1px 0 rgba(255,255,255,.1);overflow:hidden}
.card::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(90,120,255,.16),transparent 70%)}
.card:hover::after{opacity:1}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}
.glow::before{content:'';position:absolute;inset:0;border-radius:28px;padding:1.5px;z-index:2;pointer-events:none;background:conic-gradient(from var(--a),transparent 0 50%,var(--red),var(--gold),#fff6,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 5s linear infinite}
.reveal{opacity:0;transform:translateY(28px) scale(.98);filter:blur(6px);transition:opacity .8s var(--ease),transform .8s var(--ease),filter .8s var(--ease)}
.reveal.in{opacity:1;transform:none;filter:none}
.sec{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;margin-bottom:14px}
.sec .si{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--red),var(--dark));box-shadow:0 8px 18px -6px var(--red)}
.sec small{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--muted)}
@keyframes sweep{60%,100%{left:200%}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes bob{50%{transform:translateY(-7px)}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes rock{50%{transform:translateY(-3px) rotate(-12deg)}}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
#toasts{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:92vw}
.toast{padding:11px 18px;border-radius:99px;font-size:12.5px;font-weight:700;background:#0a0c1ef2;border:1px solid #3b7bff77;box-shadow:0 14px 30px #000a;display:flex;gap:8px;align-items:center;animation:tin .4s var(--ease),tout .4s 2.4s forwards}
.toast i{color:#4ade80}
@keyframes tin{from{opacity:0;transform:translateY(20px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateY(10px)}}

.adlabel{display:inline-flex;gap:6px;align-items:center;font-size:10px;font-weight:800;color:var(--gold);padding:4px 10px;border-radius:99px;border:1px solid #5cd6ff55;background:#5cd6ff14;margin-bottom:12px}
 
.stage{display:grid;place-items:center;padding:16px 10px;border-radius:22px;
  background:radial-gradient(circle at 50% 40%,#3b7bff33,transparent 65%),#ffffff06;border:1px solid var(--line)}
 

.player{position:relative;width:min(100%,340px,calc(78svh*9/16));aspect-ratio:9/16;margin:0 auto;border-radius:22px;overflow:hidden;background:#000;border:1px solid var(--line);box-shadow:0 20px 40px -16px #000,0 0 36px -14px #3b7bff88;isolation:isolate}
.player video,.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;object-fit:contain}

.player:fullscreen{width:100%;max-width:none;aspect-ratio:auto;border-radius:0;margin:0}

.player:not(:fullscreen) #bBack,.player:not(:fullscreen) #bFwd{display:none}
 
.poster{position:absolute;inset:0;z-index:3;display:grid;place-items:center;cursor:pointer;border:0;width:100%;font:inherit;color:#fff;
  background:radial-gradient(circle at 30% 20%,#3b7bff55,transparent 60%),radial-gradient(circle at 80% 90%,#6d28d966,transparent 60%),linear-gradient(160deg,#0a0b2e,#03030c);
  background-size:cover;background-position:center;transition:opacity .45s var(--ease),visibility .45s}
.poster::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#0000 40%,#000a)}
.poster::after{content:'';position:absolute;top:0;left:-120%;width:45%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transform:skewX(-20deg);animation:sweep 4.5s infinite}
.player.started .poster{opacity:0;visibility:hidden;pointer-events:none}
.pbig{position:relative;z-index:2;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:26px;padding-left:5px;
  background:linear-gradient(135deg,var(--red),var(--dark));box-shadow:0 16px 36px -8px #3b7bff,inset 0 1px 0 #fff4;transition:transform .3s var(--ease);animation:bob 3s ease-in-out infinite}
.pbig::before,.pbig::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--red);opacity:0;animation:ring 2.2s ease-out infinite}
.pbig::after{animation-delay:1.1s}
@keyframes ring{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.9)}}
.poster:hover .pbig{transform:scale(1.1)}
.ptxt{position:absolute;z-index:2;left:14px;bottom:12px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;font-weight:800;text-align:left}
.ptxt span{display:flex;gap:7px;align-items:center;text-shadow:0 2px 8px #000}
.ptxt em{font-style:normal;font:700 10.5px 'JetBrains Mono',monospace;background:#000a;padding:4px 10px;border-radius:99px;color:var(--gold)}
 
.spin{position:absolute;z-index:2;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;border:3px solid #ffffff22;border-top-color:var(--red2);animation:rot .8s linear infinite;display:none;pointer-events:none}
.player.wait .spin{display:block}
 
.ctrl{position:absolute;z-index:4;left:0;right:0;bottom:0;padding:26px 12px 10px;background:linear-gradient(transparent,#000c);display:flex;flex-direction:column;gap:7px;transition:opacity .35s,transform .35s var(--ease)}
.player.idle.playing .ctrl{opacity:0;transform:translateY(10px);pointer-events:none}
.player.idle.playing{cursor:none}
.bar{position:relative;height:16px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.bar .tr{position:relative;width:100%;height:5px;border-radius:5px;background:#ffffff26;transition:height .2s}
.bar:hover .tr,.bar.drag .tr{height:8px}
.bar .buf,.bar .fill{position:absolute;left:0;top:0;height:100%;border-radius:5px;width:0}
.bar .buf{background:#ffffff30}
.bar .fill{background:linear-gradient(90deg,var(--dark),var(--red),var(--gold));box-shadow:0 0 10px #3b7bff99}
.bar .knob{position:absolute;top:50%;left:0;width:14px;height:14px;border-radius:50%;background:#fff;transform:translate(-50%,-50%) scale(0);box-shadow:0 0 12px var(--red);transition:transform .2s var(--ease)}
.bar:hover .knob,.bar.drag .knob{transform:translate(-50%,-50%) scale(1)}
.row2{display:flex;align-items:center;gap:4px}
.cb{width:36px;height:34px;border:0;border-radius:11px;background:none;color:#fff;font-size:15px;cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s,transform .2s}
.cb:hover{background:#3b7bff33;color:var(--gold)}
.cb:active{transform:scale(.9)}
.time{font:700 11px 'JetBrains Mono',monospace;color:#d6dcf0;margin-left:6px;white-space:nowrap}

.vol{display:flex;align-items:center}
.vbar{width:0;height:34px;opacity:0;overflow:hidden;display:flex;align-items:center;cursor:pointer;touch-action:none;outline:0;transition:width .3s var(--ease),opacity .25s}
.vol:hover .vbar,.vol:focus-within .vbar,.vol.drag .vbar{width:52px;opacity:1}
.player:fullscreen .vol:hover .vbar,.player:fullscreen .vol:focus-within .vbar,.player:fullscreen .vol.drag .vbar{width:84px}
.vtr{position:relative;width:100%;height:5px;margin:0 7px;border-radius:5px;background:#ffffff26}
.vfill{position:absolute;left:0;top:0;height:100%;width:100%;border-radius:5px;background:linear-gradient(90deg,var(--red),var(--gold));box-shadow:0 0 8px #3b7bff99}
.vknob{position:absolute;top:50%;left:100%;width:12px;height:12px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 10px var(--red)}
.vbar:focus-visible .vknob{outline:2px solid var(--gold)}
.time{margin-left:2px}
@media(hover:none){.vbar{display:none}} /* điện thoại: dùng nút âm lượng của máy */
.sp{margin-left:auto;width:auto;padding:0 10px;font:800 11.5px 'JetBrains Mono',monospace;border:1px solid var(--line);background:#ffffff0d}
 
.vmeta{display:flex;align-items:center;gap:10px;margin:14px 2px 4px;font-size:11.5px;color:var(--muted);font-weight:700}
.vmeta b{color:var(--text);font-size:13.5px;display:block}
.vmeta .vi{width:42px;height:42px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;font-size:18px;color:#fff;background:#3b7bff22;border:1px solid #3b7bff66}
 
.lbl{font-size:11px;font-weight:800;color:var(--muted);margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.chaps{display:flex;flex-direction:column;gap:8px}
.chap{display:flex;align-items:center;gap:12px;width:100%;font:inherit;text-align:left;color:var(--text);cursor:pointer;padding:11px 12px;border-radius:18px;background:#ffffff08;border:1px solid var(--line);transition:transform .3s var(--ease),border-color .3s,background .3s;animation:rise .4s var(--ease) backwards;animation-delay:calc(var(--i)*70ms)}
.chap:hover{transform:translateX(4px);border-color:#3b7bff88;background:#3b7bff14}
.chap .n{width:34px;height:34px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;font-size:13px;background:#0e0f2e;border:1px solid #3b7bff88;color:var(--red2);transition:all .3s}
.chap div{flex:1;min-width:0}
.chap b{display:block;font-size:12.5px}
.chap small{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.chap .ts{font:700 11px 'JetBrains Mono',monospace;color:var(--gold);background:#00000045;border:1px solid var(--line);padding:4px 9px;border-radius:99px}
.chap.on{border-color:var(--red2);background:linear-gradient(135deg,#3b7bff33,#ffffff06);box-shadow:0 0 18px -4px #3b7bff88}
.chap.on .n{background:var(--red);color:#fff;box-shadow:0 0 14px #3b7bffaa}
 
.cta{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}
.go{width:100%;font:inherit;font-size:15px;font-weight:900;color:#fff;text-decoration:none;border:0;border-radius:20px;padding:17px;cursor:pointer;background:linear-gradient(135deg,var(--red),var(--dark));box-shadow:0 16px 32px -10px #3b7bffaa;position:relative;overflow:hidden;display:flex;gap:10px;align-items:center;justify-content:center;transition:transform .2s}
.go:hover{transform:translateY(-2px)}
.go:active{transform:scale(.97)}
.go::after{content:'';position:absolute;top:0;left:-120%;width:50%;height:100%;background:linear-gradient(90deg,transparent,#fff5,transparent);transform:skewX(-20deg);animation:sweep 3s infinite}
.go i{animation:rock 1.6s ease-in-out infinite}
.go .ext{font-size:11px;opacity:.8;animation:none}
.cta .sub{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn2{font:inherit;font-size:13px;font-weight:800;color:#fff;text-decoration:none;background:#ffffff0d;border:1px solid var(--line);border-radius:15px;padding:13px;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center;transition:all .25s}
.btn2:hover{background:#3b7bff22;border-color:#3b7bff88;transform:translateY(-2px)}
.site{margin-top:12px;text-align:center;font-size:11px;color:var(--muted);line-height:1.55}
.site b{font-family:'JetBrains Mono',monospace;color:var(--gold)}
.trust{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:12px;font-size:10.5px;font-weight:700;color:var(--muted)}
.trust i{color:var(--red2);margin-right:5px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.reveal{opacity:1;transform:none;filter:none}}

</style>
</head>

</section>
